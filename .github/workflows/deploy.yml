name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || '22' }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || '22' }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /opt/kuragoniy
          git pull --ff-only
          cd backend
          ./venv/bin/pip install -r requirements.txt
          ./venv/bin/python manage.py migrate --noinput
          ./venv/bin/python manage.py collectstatic --noinput
          # Web push (VAPID) kalitlari: yo'q bo'lsa serverning o'zida yaratib .env ga
          # yozadi, bor bo'lsa hech narsa qilmaydi — shuning uchun har deploy'da xavfsiz.
          # Maxfiy kalit hech qachon logga chiqmaydi. Yozib bo'lmasa deploy to'xtamaydi,
          # faqat ogohlantirish beradi (push o'chiq qoladi, ilova buni o'zi aytadi).
          # Chiqish faqat MUVAFFAQIYATSIZ bo'lganda ogohlantirishga qo'shiladi (unda maxfiy
          # narsa yo'q — muvaffaqiyatda esa ochiq kalitdan boshqa hech narsa chiqmaydi).
          if VAPID_OUT=$(./venv/bin/python manage.py generate_vapid_keys --write 2>&1); then
            echo "$VAPID_OUT"
          else
            echo "::warning::VAPID kalitlari .env ga yozilmadi, push ishlamaydi. Sabab: $(echo "$VAPID_OUT" | tail -n 4 | tr -s '[:space:]' ' ')"
          fi
          cd ../frontend
          npm ci
          npm run build
          sudo systemctl restart kuragoniy-backend
          sudo systemctl restart kuragoniy-bot
          EOF

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
