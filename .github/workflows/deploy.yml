name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || '22' }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || '22' }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /opt/kuragoniy
          git pull --ff-only
          cd backend
          ./venv/bin/pip install -r requirements.txt
          ./venv/bin/python manage.py migrate --noinput
          ./venv/bin/python manage.py collectstatic --noinput
          # Web push (VAPID) kalitlari. backend/.env egasi www-data (ruxsat 620): deploy
          # foydalanuvchisi uni yoza olmaydi va www-data nomidan sudo ham ishlata olmaydi
          # ("sudo: a password is required"). Lekin bazaga yoza oladi (migrate shuni qiladi),
          # shuning uchun juftlik bazada saqlanadi. Bor bo'lsa (bazada yoki .env da) hech
          # narsa qilmaydi — har deploy'da xavfsiz; kalitni almashtirish barcha obunalarni
          # bekor qilardi. Faqat ochiq kalit chiqadi, maxfiysi hech qachon. Yozib bo'lmasa
          # deploy to'xtamaydi, ogohlantirish beradi (ilova push o'chiqligini o'zi aytadi).
          if VAPID_OUT=$(./venv/bin/python manage.py generate_vapid_keys --db 2>&1); then
            echo "::notice::VAPID: $(echo "$VAPID_OUT" | tr -s '[:space:]' ' ')"
          else
            echo "::warning::VAPID kalitlari yaratilmadi, push ishlamaydi. Sabab: $(echo "$VAPID_OUT" | tail -n 4 | tr -s '[:space:]' ' ')"
          fi
          echo "::notice::VAPID sozlangan: $(./venv/bin/python manage.py shell -c 'from webpush.keys import vapid_configured as v; print(v())' 2>&1 | tail -n 1)"
          cd ../frontend
          npm ci
          npm run build
          sudo systemctl restart kuragoniy-backend
          sudo systemctl restart kuragoniy-bot
          EOF

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
