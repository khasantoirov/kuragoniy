# Bare-metal (non-Docker) nginx config — backend runs on 127.0.0.1:8000
# via systemd (see deploy/systemd/stemlms-backend.service).
server {
    listen 80;
    server_name stemlms.uz www.stemlms.uz;  # domeningizga almashtiring

    root /opt/stem-lms/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ^~ so these win over the regex extension-cache location below —
    # otherwise nginx picks the regex block (matches .jpg/.css/etc across
    # the whole site) before this prefix block, and avatars/static files
    # get served from frontend/dist instead of their real alias, 404ing.
    location ^~ /media/ {
        alias /opt/stem-lms/backend/media/;
    }

    location ^~ /static/ {
        alias /opt/stem-lms/backend/staticfiles/;
    }
}
