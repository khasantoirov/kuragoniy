# kuragoniy.uz — mirrors the live /etc/nginx/sites-available/kuragoniy
# (symlinked from sites-enabled). Backend: daphne on 127.0.0.1:8001 via
# systemd (deploy/systemd/kuragoniy-backend.service) — 8001, not 8000,
# because the same host runs amaliyfizika-backend on 8000. The rate-limit
# zones api_general / api_auth are declared in the http{} context by the
# amaliyfizika site file on this host.
server {
    server_name kuragoniy.uz www.kuragoniy.uz;

    root /opt/kuragoniy/frontend/dist;
    index index.html;

    # Browser security headers (CSP, HSTS, nosniff, ...) — the snippet is a
    # copy of deploy/nginx/security-headers.conf. Every location with its
    # own add_header includes it again (nginx doesn't inherit them).
    include snippets/kuragoniy-security.conf;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include snippets/kuragoniy-security.conf;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include snippets/kuragoniy-security.conf;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/kuragoniy-security.conf;
    }

    location /api/auth/ {
        limit_req zone=api_auth burst=50 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_general burst=200 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location ^~ /media/ {
        alias /opt/kuragoniy/backend/media/;
    }

    # Lesson files, books and equipment sheets are given out only as
    # expiring links, /api/files/<signed>/<name> (backend
    # common/protected_media.py): the view answers X-Accel-Redirect into the
    # internal location below. Their plain /media/ addresses answer 404.
    location ^~ /protected-media/ {
        internal;
        alias /opt/kuragoniy/backend/media/;
        include snippets/kuragoniy-security.conf;
    }
    location ^~ /media/lesson-files/ { return 404; }
    location ^~ /media/library-files/ { return 404; }
    location ^~ /media/equipment-sheets/ { return 404; }
    location ^~ /media/lesson-posters/ { return 404; }

    location ^~ /static/ {
        alias /opt/kuragoniy/backend/staticfiles/;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kuragoniy.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kuragoniy.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.kuragoniy.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = kuragoniy.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name kuragoniy.uz www.kuragoniy.uz;

    listen 80;
    return 404; # managed by Certbot




}
