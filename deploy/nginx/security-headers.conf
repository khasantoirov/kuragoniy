# KO'RAGONIY EDU — brauzer xavfsizlik sarlavhalari.
#
# O'rnatish: /etc/nginx/snippets/kuragoniy-security.conf ga nusxalang va
# server {} blokiga hamda O'Z add_header'i bor har bir location {} ga
# (index.html, sw.js, statik fayllar) `include snippets/kuragoniy-security.conf;`
# qo'shing — nginx'da location ichidagi add_header server darajasidagilarni
# meros qilmaydi. So'ng: sudo nginx -t && sudo systemctl reload nginx
#
# CSP manbalari kodga mos: skriptlar faqat o'zimizdan (bundle'da eval yo'q),
# shriftlar Google Fonts'dan, video — YouTube/Vimeo/Google Drive iframe,
# rasm/video havolalari tashqi https manzillardan bo'lishi mumkin (fayllar
# serverga yuklanmaydi, faqat havola saqlanadi).

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' wss://$host https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com https://drive.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
